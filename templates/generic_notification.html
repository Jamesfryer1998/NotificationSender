<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Activity on CollabLab</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 30%, #fce4ec 70%, #f3e8ff 100%);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border: 2px solid #000000;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
        }
        .header .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .content {
            padding: 2rem;
            text-align: center;
        }
        .greeting {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1.5rem;
        }
        .activity-message {
            font-size: 1rem;
            color: #4b5563;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .cta-section {
            margin: 2rem 0;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white !important;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }
        .cta-button:hover {
            transform: translateY(-2px);
        }
        .footer {
            background: #f8f9fa;
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .footer a {
            color: #3b82f6;
            text-decoration: none;
        }
        .logo {
            font-weight: 800;
            font-size: 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="emoji">🔔</span>
            <h1>New Activity</h1>
        </div>
        
        <div class="content">
            <div class="greeting">
                Hi {{ user_name }},
            </div>
            
            <div class="activity-message">
                {{ message }}
            </div>
            
            <div class="cta-section">
                <a href="{{ dashboard_url }}" class="cta-button">View Dashboard</a>
            </div>
        </div>
        
        <div class="footer">
            <div class="logo">CollabLab</div>
            <p>
                <a href="{{ dashboard_url }}">Go to Dashboard</a>
            </p>
        </div>
    </div>
</body>
</html>
